<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Pro v2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: #e5ddd5; display: flex; height: 100vh; overflow: hidden; }

    .panel-izquierdo { width: 420px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    
    .cabecera-perfil { background: #f0f2f5; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eee; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .info-usuario { flex: 1; min-width: 0; }
    .info-usuario h3 { font-size: 14px; color: #111b21; font-weight: 600; }
    .info-usuario p { font-size: 12px; color: #666; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-verde { background: #25d366; color: white; }
    .btn-rojo { background: #f15c5c; color: white; }
    .btn-azul { background: #00a884; color: white; }

    .mensaje-sistema { padding: 10px 12px; margin: 8px 0; border-radius: 6px; font-size: 13px; }
    .exito { background: #e6f9e6; color: #006600; border: 1px solid #b3e6b3; }
    .error { background: #ffe6e6; color: #990000; border: 1px solid #ffb3b3; }
    .info { background: #e6f2ff; color: #004080; border: 1px solid #b3d1ff; }

    .pestanas { display: flex; background: #f0f2f5; border-bottom: 1px solid #ddd; padding: 0 8px; }
    .pestaña { flex: 1; padding: 12px 16px; cursor: pointer; text-align: center; font-weight: 500; color: #666; border: none; background: none; font-size: 13px; transition: all 0.2s; }
    .pestaña.activa { color: #25d366; border-bottom: 3px solid #25d366; }
    .pestaña:hover { color: #111b21; }

    .buscador { padding: 8px 12px; background: #fff; border-bottom: 1px solid #eee; }
    .buscador input { width: 100%; padding: 9px 14px; border: none; border-radius: 18px; background: #f0f2f5; font-size: 13px; outline: none; }

    .seccion-form { padding: 14px; border-bottom: 1px solid #eee; max-height: 400px; overflow-y: auto; }
    .seccion-form h4 { margin-bottom: 10px; color: #111b21; font-size: 14px; }
    input { width: 100%; padding: 10px 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: #25d366; box-shadow: 0 0 3px rgba(37, 211, 102, 0.3); }
    .archivo-foto { display: none; }
    .etiqueta-foto { display: inline-block; padding: 8px 12px; background: #f0f2f5; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 6px; }
    
    .avatar-previa {
      width: 70px; height: 70px; border-radius: 50%; background: #25d366;
      display: flex; align-items: center; justify-content: center; color: white; font-size: 24px;
      margin: 10px 0; overflow: hidden; flex-shrink: 0;
    }
    .avatar-previa img { width: 100%; height: 100%; object-fit: cover; }

    .lista-contactos { flex: 1; overflow-y: auto; }
    .lista-chats { flex: 1; overflow-y: auto; }
    
    .contacto, .chat-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
    .contacto:hover, .chat-item:hover, .contacto.activo, .chat-item.activo { background: #f0f2f5; }
    
    .item-avatar { width: 42px; height: 42px; border-radius: 50%; background: #25d366; color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; overflow: hidden; flex-shrink: 0; }
    .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .item-datos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .item-nombre { font-weight: 500; font-size: 14px; color: #111b21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-info { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-hora { font-size: 12px; color: #999; flex-shrink: 0; }
    
    .sin-resultados { padding: 20px; text-align: center; color: #888; font-size: 14px; }

    .panel-derecho { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
    
    .cabecera-chat { background: #f0f2f5; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #ddd; justify-content: space-between; }
    .chat-header-info { display: flex; align-items: center; gap: 12px; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #25d366; color: white; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info h3 { font-size: 15px; color: #111b21; }
    .chat-info p { font-size: 12px; color: #666; }
    .btn-descargar-chat { padding: 6px 12px; font-size: 12px; background: #25d366; color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    .caja-mensajes { flex: 1; padding: 20px 80px; overflow-y: auto; background-image: url("https://user-images.githubusercontent.com/15075759/28719144-860c2cb8-73db-11e7-93a0-8d6d4c1e8b35.png"); display: flex; flex-direction: column; gap: 8px; }
    
    .mensaje { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; max-width: 60%; box-shadow: 0 1px 2px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    .mensaje-propio { background: #d9fdd3; align-self: flex-end; border-radius: 8px 0 8px 8px; }
    .mensaje-otro { background: #fff; align-self: flex-start; border-radius: 0 8px 8px 8px; }
    .mensaje-texto { font-size: 14px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
    .mensaje-hora { font-size: 10px; color: #667781; margin-top: 4px; text-align: right; }

    /* CÍRCULO DE PROGRESO - UI OPTIMISTA */
    .contenedor-media { position: relative; display: inline-block; }
    .overlay-carga {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .circulo-progreso {
      width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; border-top-color: white; border-right-color: white;
      animation: girar 1s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    .mensaje-media { margin-top: 8px; }
    .mensaje-imagen { max-width: 100%; max-height: 300px; border-radius: 8px; cursor: pointer; }
    .mensaje-video { max-width: 100%; max-height: 300px; border-radius: 8px; }
    .mensaje-audio { width: 100%; }
    .mensaje-archivo { background: rgba(0,0,0,0.05); padding: 10px; border-radius: 4px; text-decoration: none; color: #25d366; display: block; text-align: center; margin-top: 8px; cursor: pointer; }

    .enviar-mensaje { display: flex; padding: 12px 16px; background: #f0f2f5; gap: 10px; align-items: flex-end; }
    .input-area { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .enviar-mensaje input[type="text"] { border-radius: 18px; border: none; padding: 10px 16px; background: #fff; font-size: 14px; outline: none; margin: 0; }
    .botones-envio { display: flex; gap: 8px; }
    .btn-enviar { width: 40px; height: 40px; border-radius: 50%; border: none; background: #25d366; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
    .btn-enviar:hover { background: #20ba58; }
    .btn-archivo { width: 40px; height: 40px; border-radius: 50%; border: none; background: #25d366; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
    .btn-archivo:hover { background: #20ba58; }
    .input-archivo { display: none; }

    .vista-previa-archivo { padding: 8px; background: #f0f2f5; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .vista-previa-info { flex: 1; min-width: 0; }
    .vista-previa-nombre { font-size: 12px; color: #111b21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vista-previa-tamaño { font-size: 10px; color: #666; }
    .vista-previa-cancelar { padding: 4px 8px; background: #f15c5c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
    .modal.activo { display: flex; align-items: center; justify-content: center; }
    .modal-contenido { max-width: 90%; max-height: 90%; }
    .modal-contenido img { max-width: 100%; max-height: 100%; }
    .modal-cerrar { position: absolute; top: 20px; right: 30px; font-size: 30px; color: white; cursor: pointer; }

    .oculto { display: none !important; }
    .vacio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; text-align: center; padding: 40px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #999; }

    @media (max-width: 768px) {
      .panel-izquierdo { width: 100%; }
      .panel-derecho { display: none; }
      .caja-mensajes { padding: 20px; }
      .mensaje { max-width: 90%; }
    }
  </style>
</head>
<body>

  <div class="panel-izquierdo">
    <div id="cabecera-perfil" class="cabecera-perfil oculto">
      <div class="avatar">
        <span id="inicial-nombre"></span>
        <img id="foto-perfil-mostrar" class="oculto" alt="">
      </div>
      <div class="info-usuario">
        <h3 id="mostrar-nombre-usuario"></h3>
        <p id="correo-usuario"></p>
      </div>
      <button id="btn-cerrar-sesion" class="btn btn-rojo">Salir</button>
    </div>

    <div id="seccion-auth" class="seccion-form">
      <h3 style="margin-bottom: 12px; text-align: center;">Bienvenido 👋</h3>
      <input type="email" id="correo" placeholder="Correo electrónico">
      <input type="password" id="contrasena" placeholder="Contraseña (mín. 6 caracteres)">
      <button id="btn-ingresar" class="btn btn-verde" style="width: 100%; margin-top: 8px;">Ingresar</button>
      <p style="margin: 12px 0; font-size: 13px; text-align: center;">¿No tienes cuenta?</p>
      <button id="btn-registrar" class="btn btn-azul" style="width: 100%;">Crear cuenta</button>
      <div id="msg-auth"></div>
    </div>

    <div id="seccion-perfil" class="seccion-form oculto">
      <h4>✏️ Configura tu perfil</h4>
      <div class="avatar-previa" id="avatar-previa">
        <span id="previa-inicial">?</span>
        <img id="previa-foto" class="oculto" alt="Vista previa">
      </div>
      <input type="text" id="nombre-personalizado" placeholder="Tu nombre para mostrar">
      <label class="etiqueta-foto">
        📷 Elegir foto de perfil
        <input type="file" id="foto-perfil" accept="image/*" class="archivo-foto">
      </label>
      <button id="btn-guardar-perfil" class="btn btn-verde" style="width: 100%; margin-top: 8px;">Guardar perfil</button>
      <div id="msg-perfil"></div>
    </div>

    <div id="seccion-agregar" class="seccion-form oculto">
      <h4>➕ Agregar contacto</h4>
      <input type="text" id="dato-contacto" placeholder="Correo o nombre del contacto">
      <button id="btn-agregar-contacto" class="btn btn-verde" style="width: 100%;">Buscar y agregar</button>
      <div id="msg-contacto"></div>
    </div>

    <div id="seccion-busqueda" class="buscador oculto">
      <input type="text" id="buscar-contacto" placeholder="🔍 Buscar por nombre o correo...">
    </div>

    <div id="pestanas" class="pestanas oculto">
      <button class="pestaña activa" data-pestaña="contactos">👥 Contactos</button>
      <button class="pestaña" data-pestaña="chats">💬 Chats</button>
    </div>

    <div id="lista-contactos" class="lista-contactos oculto"></div>
    <div id="lista-chats" class="lista-chats oculto"></div>
  </div>

  <div class="panel-derecho">
    <div id="cabecera-chat" class="cabecera-chat oculto">
      <div class="chat-header-info">
        <div class="chat-avatar">
          <span id="chat-inicial"></span>
          <img id="chat-foto" class="oculto" alt="">
        </div>
        <div class="chat-info">
          <h3 id="chat-nombre">—</h3>
          <p id="chat-estado">En línea</p>
        </div>
      </div>
      <button id="btn-descargar-chat" class="btn-descargar-chat">⬇️ Descargar Chat</button>
    </div>
    <div id="caja-mensajes" class="caja-mensajes">
      <div class="vacio"><h2>💬 Selecciona un contacto</h2><p>Inicia sesión para empezar</p></div>
    </div>
    <div id="enviar-mensaje" class="enviar-mensaje oculto">
      <div class="input-area">
        <div id="vista-previa-archivo" class="vista-previa-archivo oculto">
          <div class="vista-previa-info">
            <div class="vista-previa-nombre" id="vista-previa-nombre"></div>
            <div class="vista-previa-tamaño" id="vista-previa-tamaño"></div>
          </div>
          <button class="vista-previa-cancelar" id="btn-cancelar-archivo">✕</button>
        </div>
        <div class="botones-envio">
          <input type="text" id="texto-mensaje" placeholder="Escribe un mensaje... 😊">
          <button id="btn-archivo" class="btn-archivo" title="Enviar archivo">📎</button>
          <input type="file" id="input-archivo" class="input-archivo" accept=".mp4,.mp3,.jpg,.jpeg,.png,.webp,.gif,.pdf,.doc,.docx,.txt,.html,.htm,.zip,.rar">
          <button id="btn-enviar" class="btn-enviar">➤</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-imagen" class="modal">
    <span class="modal-cerrar">&times;</span>
    <img class="modal-contenido" id="modal-imagen-contenido" alt="">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, push, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcuomzuOwk81sFQ-WYe7TSRPOMj44ScIk",
      authDomain: "com-example-chatbasico-562ab.firebaseapp.com",
      databaseURL: "https://com-example-chatbasico-562ab-default-rtdb.firebaseio.com",
      projectId: "com-example-chatbasico-562ab",
      storageBucket: "com-example-chatbasico-562ab.appspot.com",
      messagingSenderId: "926175029862",
      appId: "1:926175029862:web:9c1ba3c78b7a6c7a5d5e5c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    let usuarioActual = null;
    let datosUsuario = {};
    let fotoPerfilActual = '';
    let contactoSeleccionado = null;
    let todosMisContactos = {};
    let todosChatsRecientes = {};
    let mensajesListener = null;
    let pestañaActual = 'contactos';
    let archivoSeleccionado = null;

    const cabeceraChat = document.getElementById('cabecera-chat');
    const cajaMensajes = document.getElementById('caja-mensajes');
    const enviarMensajeDiv = document.getElementById('enviar-mensaje');
    const listaContactos = document.getElementById('lista-contactos');
    const listaChats = document.getElementById('lista-chats');
    const buscador = document.getElementById('buscar-contacto');
    const pestanas = document.getElementById('pestanas');
    const inputArchivo = document.getElementById('input-archivo');
    const vistaPrevia = document.getElementById('vista-previa-archivo');
    const modal = document.getElementById('modal-imagen');

    function idChat(u1, u2) { return u1 < u2 ? `${u1}_${u2}` : `${u2}_${u1}`; }

    function mostrarMsg(id, msg, tipo) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = `<div class="mensaje-sistema ${tipo}">${msg}</div>`;
      setTimeout(() => { el.innerHTML = ''; }, 5000);
    }

    function guardarMensajeLocal(chatId, mensaje) {
      const key = `chat_${chatId}`;
      let mensajes = JSON.parse(localStorage.getItem(key) || '[]');
      mensajes.push(mensaje);
      localStorage.setItem(key, JSON.stringify(mensajes));
    }

    function obtenerMensajesLocales(chatId) {
      const key = `chat_${chatId}`;
      return JSON.parse(localStorage.getItem(key) || '[]');
    }

    function descargarChat() {
      if (!contactoSeleccionado) return;
      const chatId = idChat(usuarioActual.uid, contactoSeleccionado.uid);
      const mensajes = obtenerMensajesLocales(chatId);
      const datos = {
        contacto: contactoSeleccionado.nombre || contactoSeleccionado.correo,
        correo: contactoSeleccionado.correo,
        fecha: new Date().toISOString(),
        mensajes: mensajes
      };
      const json = JSON.stringify(datos, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chat_${contactoSeleccionado.nombre || contactoSeleccionado.correo}_${new Date().getTime()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function formatearTamaño(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function obtenerTipoDelNombre(nombre) {
      const ext = nombre.split('.').pop().toLowerCase();
      const tipos = {
        'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'png': 'image/png', 'webp': 'image/webp', 'gif': 'image/gif',
        'mp4': 'video/mp4', 'avi': 'video/avi', 'mov': 'video/quicktime',
        'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'm4a': 'audio/mp4'
      };
      return tipos[ext] || 'application/octet-stream';
    }

    // AUTENTICACIÓN
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        usuarioActual = user;
        document.getElementById('seccion-auth').classList.add('oculto');
        document.getElementById('seccion-perfil').classList.add('oculto');
        document.getElementById('seccion-agregar').classList.remove('oculto');
        document.getElementById('cabecera-perfil').classList.remove('oculto');
        document.getElementById('seccion-busqueda').classList.remove('oculto');
        document.getElementById('pestanas').classList.remove('oculto');
        listaContactos.classList.remove('oculto');
        listaChats.classList.remove('oculto');

        const datosRef = ref(db, `usuarios/${user.uid}`);
        const snap = await get(datosRef);
        if (snap.exists()) {
          datosUsuario = snap.val();
          fotoPerfilActual = datosUsuario.fotoPerfil || '';
          document.getElementById('mostrar-nombre-usuario').textContent = datosUsuario.nombre || user.email.split('@')[0];
          document.getElementById('correo-usuario').textContent = user.email;
          document.getElementById('inicial-nombre').textContent = (datosUsuario.nombre || user.email)[0].toUpperCase();
          if (fotoPerfilActual) {
            document.getElementById('foto-perfil-mostrar').src = fotoPerfilActual;
            document.getElementById('foto-perfil-mostrar').classList.remove('oculto');
            document.getElementById('inicial-nombre').classList.add('oculto');
          }
        }
        cargarContactos();
        cargarChatsRecientes();
      } else {
        usuarioActual = null;
        document.getElementById('seccion-auth').classList.remove('oculto');
        document.getElementById('seccion-perfil').classList.add('oculto');
        document.getElementById('seccion-agregar').classList.add('oculto');
        document.getElementById('cabecera-perfil').classList.add('oculto');
        document.getElementById('seccion-busqueda').classList.add('oculto');
        document.getElementById('pestanas').classList.add('oculto');
        listaContactos.classList.add('oculto');
        listaChats.classList.add('oculto');
        cabeceraChat.classList.add('oculto');
        enviarMensajeDiv.classList.add('oculto');
      }
    });

    document.getElementById('btn-registrar').addEventListener('click', async () => {
      const correo = document.getElementById('correo').value.trim();
      const contrasena = document.getElementById('contrasena').value.trim();
      if (!correo || !contrasena) {
        mostrarMsg('msg-auth', 'Completa todos los campos', 'error');
        return;
      }
      if (contrasena.length < 6) {
        mostrarMsg('msg-auth', 'La contraseña debe tener al menos 6 caracteres', 'error');
        return;
      }
      try {
        const userCred = await createUserWithEmailAndPassword(auth, correo, contrasena);
        await set(ref(db, `usuarios/${userCred.user.uid}`), {
          correo: userCred.user.email,
          nombre: correo.split('@')[0],
          fotoPerfil: '',
          creado: new Date().toISOString()
        });
        document.getElementById('seccion-perfil').classList.remove('oculto');
        mostrarMsg('msg-auth', '✅ Cuenta creada. Configura tu perfil', 'exito');
      } catch (e) {
        mostrarMsg('msg-auth', 'Error: ' + e.message, 'error');
      }
    });

    document.getElementById('btn-ingresar').addEventListener('click', async () => {
      const correo = document.getElementById('correo').value.trim();
      const contrasena = document.getElementById('contrasena').value.trim();
      if (!correo || !contrasena) {
        mostrarMsg('msg-auth', 'Completa todos los campos', 'error');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, correo, contrasena);
      } catch (e) {
        mostrarMsg('msg-auth', 'Error: ' + e.message, 'error');
      }
    });

    document.getElementById('btn-cerrar-sesion').addEventListener('click', async () => {
      await signOut(auth);
    });

    document.getElementById('foto-perfil').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('previa-foto').src = event.target.result;
          document.getElementById('previa-foto').classList.remove('oculto');
          document.getElementById('previa-inicial').classList.add('oculto');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('btn-guardar-perfil').addEventListener('click', async () => {
      if (!usuarioActual) return;
      const nombre = document.getElementById('nombre-personalizado').value.trim() || usuarioActual.email.split('@')[0];
      const fileInput = document.getElementById('foto-perfil');
      try {
        let fotoPerfil = fotoPerfilActual;
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const storagePath = storageRef(storage, `fotos_perfil/${usuarioActual.uid}`);
          await uploadBytes(storagePath, file);
          fotoPerfil = await getDownloadURL(storagePath);
        }
        await set(ref(db, `usuarios/${usuarioActual.uid}`), {
          correo: usuarioActual.email,
          nombre,
          fotoPerfil,
          actualizado: new Date().toISOString()
        }, { merge: true });
        datosUsuario = { correo: usuarioActual.email, nombre, fotoPerfil };
        fotoPerfilActual = fotoPerfil;
        document.getElementById('mostrar-nombre-usuario').textContent = nombre;
        document.getElementById('inicial-nombre').textContent = nombre[0].toUpperCase();
        if (fotoPerfil) {
          document.getElementById('foto-perfil-mostrar').src = fotoPerfil;
          document.getElementById('foto-perfil-mostrar').classList.remove('oculto');
          document.getElementById('inicial-nombre').classList.add('oculto');
        }
        document.getElementById('seccion-perfil').classList.add('oculto');
        mostrarMsg('msg-perfil', '✅ Perfil actualizado', 'exito');
      } catch (e) {
        mostrarMsg('msg-perfil', 'Error: ' + e.message, 'error');
      }
    });

    document.getElementById('btn-agregar-contacto').addEventListener('click', async () => {
      const dato = document.getElementById('dato-contacto').value.trim().toLowerCase();
      if (!dato) return mostrarMsg('msg-contacto', 'Escribe el correo o nombre del contacto', 'error');
      if (!usuarioActual) return;
      const correoActual = usuarioActual.email.toLowerCase();
      if (dato === correoActual) return mostrarMsg('msg-contacto', 'No puedes agregarte a ti mismo', 'error');
      try {
        const usuariosRef = ref(db, 'usuarios');
        const todos = await get(usuariosRef);
        let encontrado = null;
        const sugerencias = [];
        if (todos.exists()) {
          todos.forEach(c => {
            const u = c.val();
            const nombre = (u.nombre || '').toLowerCase();
            const correo = (u.correo || '').toLowerCase();
            if (c.key === usuarioActual.uid) return;
            if (nombre === dato || correo === dato) {
              encontrado = { uid: c.key, ...u };
              return;
            }
            if (nombre.includes(dato) || correo.includes(dato)) {
              sugerencias.push({ uid: c.key, ...u });
            }
          });
        }
        if (!encontrado && sugerencias.length > 0) {
          encontrado = sugerencias[0];
        }
        if (!encontrado) {
          return mostrarMsg('msg-contacto', '❌ No encontrado', 'error');
        }
        const yaExiste = await get(ref(db, `mis_contactos/${usuarioActual.uid}/${encontrado.uid}`));
        if (yaExiste.exists()) {
          return mostrarMsg('msg-contacto', 'ℹ️ Ya está en tus contactos', 'info');
        }
        await set(ref(db, `mis_contactos/${usuarioActual.uid}/${encontrado.uid}`), {
          nombre: encontrado.nombre || encontrado.correo.split('@')[0],
          correo: encontrado.correo,
          fotoPerfil: encontrado.fotoPerfil || ''
        });
        await set(ref(db, `mis_contactos/${encontrado.uid}/${usuarioActual.uid}`), {
          nombre: datosUsuario.nombre || usuarioActual.email.split('@')[0],
          correo: usuarioActual.email,
          fotoPerfil: fotoPerfilActual || ''
        });
        mostrarMsg('msg-contacto', '✅ Contacto agregado', 'exito');
        document.getElementById('dato-contacto').value = '';
      } catch (e) {
        mostrarMsg('msg-contacto', 'Error: ' + e.message, 'error');
      }
    });

    buscador.addEventListener('input', (e) => {
      if (pestañaActual === 'contactos') {
        renderizarContactos(e.target.value.trim().toLowerCase());
      }
    });

    function cargarContactos() {
      const refMis = ref(db, `mis_contactos/${usuarioActual.uid}`);
      onValue(refMis, (snap) => {
        todosMisContactos = {};
        if (snap.exists()) {
          snap.forEach(c => {
            todosMisContactos[c.key] = { uid: c.key, ...c.val() };
          });
        }
        if (pestañaActual === 'contactos') {
          renderizarContactos('');
        }
      });
    }

    function renderizarContactos(filtro = '') {
      listaContactos.innerHTML = '';
      let items = Object.values(todosMisContactos);
      if (items.length === 0) {
        listaContactos.innerHTML = `<p class="sin-resultados">No tienes contactos</p>`;
        return;
      }
      if (filtro) {
        items = items.filter(c => {
          const nombre = (c.nombre || '').toLowerCase();
          const correo = (c.correo || '').toLowerCase();
          return nombre.includes(filtro) || correo.includes(filtro);
        });
      }
      if (items.length === 0) {
        listaContactos.innerHTML = `<p class="sin-resultados">Sin resultados</p>`;
        return;
      }
      items.forEach(c => {
        const div = document.createElement('div');
        div.className = `contacto ${contactoSeleccionado?.uid === c.uid ? 'activo' : ''}`;
        const inicial = (c.nombre || c.correo || '?')[0].toUpperCase();
        div.innerHTML = `
          <div class="item-avatar">${c.fotoPerfil ? `<img src="${c.fotoPerfil}" alt="">` : inicial}</div>
          <div class="item-datos">
            <div class="item-nombre">${c.nombre || c.correo}</div>
            <div class="item-info">${c.correo}</div>
          </div>
        `;
        div.addEventListener('click', () => seleccionarContacto(c));
        listaContactos.appendChild(div);
      });
    }

    function cargarChatsRecientes() {
      const refChats = ref(db, `chats`);
      onValue(refChats, (snap) => {
        todosChatsRecientes = {};
        if (snap.exists()) {
          snap.forEach(chatNode => {
            const chatId = chatNode.key;
            const [uid1, uid2] = chatId.split('_');
            if (uid1 === usuarioActual.uid || uid2 === usuarioActual.uid) {
              const otroUid = uid1 === usuarioActual.uid ? uid2 : uid1;
              const contacto = todosMisContactos[otroUid];
              if (contacto) {
                const mensajesLocales = obtenerMensajesLocales(chatId);
                if (mensajesLocales.length > 0) {
                  const ultimoMensaje = mensajesLocales[mensajesLocales.length - 1];
                  todosChatsRecientes[otroUid] = {
                    ...contacto,
                    ultimoMensaje: ultimoMensaje.texto || '[Archivo]',
                    ultimaHora: ultimoMensaje.hora,
                    esPropio: ultimoMensaje.de === usuarioActual.uid
                  };
                }
              }
            }
          });
        }
        if (pestañaActual === 'chats') {
          renderizarChatsRecientes();
        }
      });
    }

    function renderizarChatsRecientes() {
      listaChats.innerHTML = '';
      let items = Object.values(todosChatsRecientes).sort((a, b) => new Date(b.ultimaHora) - new Date(a.ultimaHora));
      if (items.length === 0) {
        listaChats.innerHTML = `<p class="sin-resultados">No hay chats</p>`;
        return;
      }
      items.forEach(c => {
        const div = document.createElement('div');
        div.className = `chat-item ${contactoSeleccionado?.uid === c.uid ? 'activo' : ''}`;
        const inicial = (c.nombre || c.correo || '?')[0].toUpperCase();
        const fecha = new Date(c.ultimaHora);
        const ahora = new Date();
        const mismodia = fecha.toDateString() === ahora.toDateString();
        const hora = mismodia ? fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : fecha.toLocaleDateString([], {month:'short', day:'numeric'});
        const prefijo = c.esPropio ? 'Tú: ' : '';
        const mensaje = (prefijo + c.ultimoMensaje).substring(0, 35) + (c.ultimoMensaje.length > 35 ? '...' : '');
        div.innerHTML = `
          <div class="item-avatar">${c.fotoPerfil ? `<img src="${c.fotoPerfil}" alt="">` : inicial}</div>
          <div class="item-datos">
            <div class="item-nombre">${c.nombre || c.correo}</div>
            <div class="item-info">${mensaje}</div>
          </div>
          <div class="item-hora">${hora}</div>
        `;
        div.addEventListener('click', () => seleccionarContacto(c));
        listaChats.appendChild(div);
      });
    }

    document.querySelectorAll('.pestaña').forEach(pestaña => {
      pestaña.addEventListener('click', () => {
        document.querySelectorAll('.pestaña').forEach(p => p.classList.remove('activa'));
        pestaña.classList.add('activa');
        pestañaActual = pestaña.dataset.pestaña;
        if (pestañaActual === 'contactos') {
          buscador.classList.remove('oculto');
          listaContactos.classList.remove('oculto');
          listaChats.classList.add('oculto');
          renderizarContactos('');
        } else {
          buscador.classList.add('oculto');
          listaContactos.classList.add('oculto');
          listaChats.classList.remove('oculto');
          renderizarChatsRecientes();
        }
      });
    });

    document.getElementById('btn-archivo').addEventListener('click', () => {
      inputArchivo.click();
    });

    inputArchivo.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      archivoSeleccionado = {
        file: file,
        nombre: file.name,
        tamaño: formatearTamaño(file.size)
      };
      document.getElementById('vista-previa-nombre').textContent = file.name;
      document.getElementById('vista-previa-tamaño').textContent = archivoSeleccionado.tamaño;
      vistaPrevia.classList.remove('oculto');
      const reader = new FileReader();
      reader.onload = (evt) => {
        archivoSeleccionado.data = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-cancelar-archivo').addEventListener('click', () => {
      archivoSeleccionado = null;
      vistaPrevia.classList.add('oculto');
      inputArchivo.value = '';
    });

    function seleccionarContacto(contacto) {
      contactoSeleccionado = contacto;
      cabeceraChat.classList.remove('oculto');
      document.getElementById('chat-nombre').textContent = contacto.nombre || contacto.correo;
      const inicial = (contacto.nombre || contacto.correo || '?')[0].toUpperCase();
      document.getElementById('chat-inicial').textContent = inicial;
      document.getElementById('chat-inicial').classList.toggle('oculto', !!contacto.fotoPerfil);
      document.getElementById('chat-foto').classList.toggle('oculto', !contacto.fotoPerfil);
      if (contacto.fotoPerfil) document.getElementById('chat-foto').src = contacto.fotoPerfil;
      document.getElementById('chat-estado').textContent = '✅ En línea';
      enviarMensajeDiv.classList.remove('oculto');
      renderizarContactos('');
      renderizarChatsRecientes();
      escucharMensajes();
    }

    function escucharMensajes() {
      if (!contactoSeleccionado) return;
      if (mensajesListener) mensajesListener();
      const chatId = idChat(usuarioActual.uid, contactoSeleccionado.uid);
      const refChat = ref(db, `chats/${chatId}/mensajes`);
      mensajesListener = onValue(refChat, (snap) => {
        const mensajesFirebase = [];
        if (snap.exists()) {
          snap.forEach(m => {
            mensajesFirebase.push({
              id: m.key,
              ...m.val()
            });
          });
        }
        const mensajesLocales = obtenerMensajesLocales(chatId);
        const todosLosMensajes = [...mensajesFirebase];
        mensajesLocales.forEach(msgLocal => {
          const yaExiste = todosLosMensajes.some(mf => mf.hora === msgLocal.hora && mf.de === msgLocal.de && mf.texto === msgLocal.texto);
          if (!yaExiste) {
            todosLosMensajes.push(msgLocal);
          }
        });
        todosLosMensajes.sort((a, b) => new Date(a.hora) - new Date(b.hora));
        localStorage.setItem(`chat_${chatId}`, JSON.stringify(todosLosMensajes));
        renderizarMensajes(todosLosMensajes);
      });
    }

    function renderizarMensajes(mensajes) {
      cajaMensajes.innerHTML = '';
      if (mensajes.length === 0) {
        cajaMensajes.innerHTML = `<div class="vacio"><h2>👋 ¡Hola!</h2></div>`;
        return;
      }
      const orderedMensajes = mensajes.sort((a, b) => new Date(a.hora) - new Date(b.hora));
      orderedMensajes.forEach(d => {
        const propio = d.de === usuarioActual.uid;
        const fecha = new Date(d.hora);
        const hora = fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const div = document.createElement('div');
        div.className = `mensaje ${propio ? 'mensaje-propio' : 'mensaje-otro'}`;
        let contenido = `<div class="mensaje-texto">${d.texto}</div>`;
        if (d.archivo) {
          const tipo = d.archivo.tipo || obtenerTipoDelNombre(d.archivo.nombre);
          const url = d.archivo.localUrl || d.archivo.url;
          let overlay = '';
          if (d.archivo.estado === 'subiendo') {
            overlay = '<div class="overlay-carga"><div class="circulo-progreso"></div></div>';
          }
          if (tipo.startsWith('image/')) {
            contenido = `<div class="mensaje-media contenedor-media"><img src="${url}" class="mensaje-imagen" alt="${d.archivo.nombre}" style="max-width: 250px; max-height: 300px; border-radius: 8px;">${overlay}</div>${contenido}`;
          } else if (tipo.startsWith('video/')) {
            contenido = `<div class="mensaje-media contenedor-media"><video controls class="mensaje-video" style="max-width: 250px;"><source src="${url}" type="video/mp4"></video>${overlay}</div>${contenido}`;
          } else if (tipo.startsWith('audio/')) {
            contenido = `<div class="mensaje-media"><audio controls class="mensaje-audio" style="width: 100%;"><source src="${url}" type="${tipo}"></audio>${overlay}</div>${contenido}`;
          } else {
            contenido = `<div class="mensaje-media"><a href="${url}" class="mensaje-archivo" target="_blank">📁 ${d.archivo.nombre}</a></div>${contenido}`;
          }
        }
        div.innerHTML = contenido + `<div class="mensaje-hora">${hora}</div>`;
        if (d.archivo && (d.archivo.tipo?.startsWith('image/') || obtenerTipoDelNombre(d.archivo.nombre).startsWith('image/'))) {
          const img = div.querySelector('.mensaje-imagen');
          if (img) {
            img.addEventListener('click', () => {
              document.getElementById('modal-imagen-contenido').src = img.src;
              modal.classList.add('activo');
            });
          }
        }
        cajaMensajes.appendChild(div);
      });
      cajaMensajes.scrollTop = cajaMensajes.scrollHeight;
    }

    document.getElementById('btn-enviar').addEventListener('click', enviarMsg);
    document.getElementById('texto-mensaje').addEventListener('keydown', e => e.key === 'Enter' && enviarMsg());

    async function enviarMsg() {
      if (!contactoSeleccionado) return;
      const texto = document.getElementById('texto-mensaje').value.trim();
      if (!texto && !archivoSeleccionado) return;
      const chatId = idChat(usuarioActual.uid, contactoSeleccionado.uid);
      const nuevoMensajeRef = push(ref(db, `chats/${chatId}/mensajes`));
      let mensaje = {
        de: usuarioActual.uid,
        para: contactoSeleccionado.uid,
        texto: texto || '[Archivo]',
        hora: new Date().toISOString()
      };
      let archivoParaSubir = null;
      let localUrl = null;
      if (archivoSeleccionado) {
        archivoParaSubir = { ...archivoSeleccionado };
        let blob;
        if (archivoSeleccionado.data && archivoSeleccionado.data.startsWith('data:')) {
          const base64Data = archivoSeleccionado.data.split(',')[1];
          const binaryString = atob(base64Data);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          blob = new Blob([bytes], { type: archivoSeleccionado.file.type });
        } else {
          blob = archivoSeleccionado.file;
        }
        localUrl = URL.createObjectURL(blob);
        mensaje.archivo = {
          nombre: archivoSeleccionado.nombre,
          tamaño: archivoSeleccionado.tamaño,
          tipo: archivoSeleccionado.file.type,
          localUrl: localUrl,
          estado: "subiendo"
        };
      }
      try {
        await set(nuevoMensajeRef, mensaje);
      } catch (e) {
        mostrarMsg('msg-error', 'Error al enviar', 'error');
        return;
      }
      guardarMensajeLocal(chatId, mensaje);
      document.getElementById('texto-mensaje').value = '';
      archivoSeleccionado = null;
      vistaPrevia.classList.add('oculto');
      inputArchivo.value = '';
      if (archivoParaSubir) {
        (async () => {
          try {
            const timestamp = Date.now();
            const nombreSeguro = archivoParaSubir.nombre.replace(/[^a-zA-Z0-9.-]/g, '_');
            const rutaStorage = `chats/${chatId}/${timestamp}_${nombreSeguro}`;
            const storagePath = storageRef(storage, rutaStorage);
            let blob;
            if (archivoParaSubir.data && archivoParaSubir.data.startsWith('data:')) {
              const base64Data = archivoParaSubir.data.split(',')[1];
              const binaryString = atob(base64Data);
              const bytes = new Uint8Array(binaryString.length);
              for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
              }
              blob = new Blob([bytes], { type: archivoParaSubir.file.type });
            } else {
              blob = archivoParaSubir.file;
            }
            const taskSnapshot = await uploadBytes(storagePath, blob);
            const urlArchivo = await getDownloadURL(taskSnapshot.ref);
            mensaje.archivo.url = urlArchivo;
            mensaje.archivo.estado = "completado";
            delete mensaje.archivo.localUrl;
            await set(nuevoMensajeRef, mensaje);
            guardarMensajeLocal(chatId, mensaje);
          } catch (e) {
            console.error('Error:', e);
            mensaje.archivo.estado = "fallido";
            await set(nuevoMensajeRef, mensaje);
          }
        })();
      }
      cargarChatsRecientes();
    }

    document.getElementById('btn-descargar-chat').addEventListener('click', descargarChat);
    document.querySelector('.modal-cerrar').addEventListener('click', () => {
      modal.classList.remove('activo');
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('activo');
      }
    });
  </script>
</body>
